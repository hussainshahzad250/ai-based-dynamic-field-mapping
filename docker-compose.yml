version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  ai-mapping-service:
    build:
      context: ./ai-mapping-service
      dockerfile: Dockerfile
    container_name: ai-mapping-service
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_PROVIDER=ollama
      - AI_MODEL=llama3.2
      - AI_ENDPOINT=http://host.docker.internal:11434/api/generate
      - ADMIN_API_KEY=admin-secret-key
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mapping-engine:
    build:
      context: ./mapping-engine
      dockerfile: Dockerfile
    container_name: mapping-engine
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVICE_URL=http://ai-mapping-service:8081
    depends_on:
      redis:
        condition: service_healthy
      ai-mapping-service:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
