server:
  port: 8081

spring:
  application:
    name: ai-mapping-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour
      cache-null-values: false

ai:
  provider: ${AI_PROVIDER:ollama}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:llama3.1:8b}
  endpoint: ${AI_ENDPOINT:http://localhost:11434/api/generate}
  cache:
    enabled: true
    ttl-hours: 24

admin:
  api-key: ${ADMIN_API_KEY:admin-secret-key}

logging:
  level:
    com.fintech.ai: INFO
    org.springframework.data.redis: WARN
